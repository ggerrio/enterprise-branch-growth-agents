[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "branch-growth-analyst"
version = "0.1.0"
description = "Vessel Bank - Enterprise Multi-Agent Growth Strategy Suite"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "streamlit>=1.24.0",
    "pandas>=2.0.0",
    "rich>=13.0.0",
    "pytest>=7.0.0",
    "python-dotenv>=1.0.0",
    "google-adk>=0.1.0",
]

[project.urls]
"Homepage" = "https://github.com/ggerrio/enterprise-branch-growth-agents"

[project.scripts]
vessel-bank-simulate = "branch_growth_analyst.cli:run_simulation_cli"
vessel-bank-evaluate = "branch_growth_analyst.cli:run_evaluation_cli"
vessel-bank-governance = "branch_growth_analyst.cli:run_governance_cli"
